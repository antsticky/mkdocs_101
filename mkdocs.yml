site_name: Example Project Name
theme:
  font:
    text: Playfair Display
  logo: images/favicon.png
  favicon: images/favicon.png
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.indexes
  toc:
    depth: 2


plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_root_heading: true
            show_source: true
            heading_level: 3
            extra:
              render_module_header: true

nav:
  - Home: index.md
  - API: api.md
  - Frontend:
      - Overview: frontend/overview.md
      - Main: frontend/main.md
      - Models: frontend/models.md
      - Handlers: frontend/handlers.md

extra_css:
  - stylesheets/extra.css

extra:
  version:
    provider: mike